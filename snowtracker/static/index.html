<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snowfall Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f6f8fb; --panel: #ffffff; --text: #18202b; --muted: #5b6878;
    --border: #d9e0e8; --accent: #2563eb; --ok: #16a34a; --warn: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141b; --panel: #18202b; --text: #e6edf5; --muted: #93a1b3;
      --border: #2a3646; --accent: #60a5fa; --ok: #4ade80; --warn: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }
  .search { display: flex; gap: 6px; padding: 6px; }
  /* bottom-left corner: zoom buttons, then search to their right */
  .leaflet-bottom.leaflet-left { display: flex; align-items: flex-end; }
  .leaflet-bottom.leaflet-left .leaflet-control-zoom { order: 0; }
  .leaflet-bottom.leaflet-left .search { order: 1; }
  .leaflet-bottom { padding-bottom: env(safe-area-inset-bottom); }
  select, input, button { font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  input { width: 110px; }
  #status { margin-left: auto; color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .dot.live { background: var(--ok); }
  #map { flex: 1; }
  .legend { background: var(--panel); color: var(--text); padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); font-size: 12px; line-height: 1.6; }
  .key i { display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    margin-right: 6px; vertical-align: -2px; border: 1px solid #0003; }
  .leaflet-control-attribution { font-size: 9px; opacity: .7; }

  [hidden] { display: none !important; }
  /* ---------- phones ---------- */
  @media (max-width: 600px) {

    #status { font-size: 11px; }
    #search input { width: 92px; }
    .key { padding: 4px 7px; font-size: 10px; line-height: 1.5; }
    .key i { width: 9px; height: 9px; margin-right: 4px; }
    /* 16px stops iOS from zooming in when a field is focused; 40px = tappable */
    select, input, button { font-size: 16px; min-height: 40px; }
    .leaflet-control-attribution { font-size: 9px; max-width: 100vw; }
  }
</style>
</head>
<body>
<div id="app">
  <div hidden>
      <label>Show
        <select id="metric">
          <option value="snowfall_24h_in">Snowfall, past 24h</option>
          <option value="forecast_24h_in">Forecast, next 24h</option>
          <option value="snowfall_1h_in">Snowfall, last hour</option>
          <option value="snow_depth_in">Snow depth</option>
        </select>
      </label>
    <div id="status"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
  </div>
  <form id="search" class="legend search">
    <input id="zip" placeholder="Zip code" inputmode="numeric" maxlength="5" aria-label="Zip code">
    <button>Go</button>
  </form>
  <div id="map"></div>
</div>
<script>
const SCALES = {
  snowfall_24h_in: [0.1, 1, 3, 6, 12],
  forecast_24h_in: [0.1, 1, 3, 6, 12],
  snowfall_1h_in:  [0.01, 0.1, 0.25, 0.5, 1],
  snow_depth_in:   [0.5, 2, 6, 12, 24],
};
const COLORS = ['#c7dcf0', '#8fbde6', '#4f93d6', '#2c5fb8', '#5b2fa6', '#a51d6e'];

const isTouch = matchMedia('(pointer: coarse)').matches;
const isPhone = () => matchMedia('(max-width: 600px)').matches;
const map = L.map('map', { preferCanvas: true, zoomControl: false, zoomSnap: 0.1,
  renderer: L.canvas({ tolerance: isTouch ? 10 : 0 }) }).setView([44.6, -85.5], 7);
L.control.zoom({ position: 'bottomleft' }).addTo(map);
const searchCtl = L.control({ position: 'bottomleft' });
searchCtl.onAdd = () => {
  const el = document.getElementById('search');
  L.DomEvent.disableClickPropagation(el);
  L.DomEvent.disableScrollPropagation(el);
  return el;
};
searchCtl.addTo(map);
map.attributionControl.setPrefix(false);   // drop the "Leaflet" link; OSM credit is required
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Open-Meteo · GeoNames · Census',
  maxZoom: 19,
}).addTo(map);

const layer = L.layerGroup().addTo(map);
// Zip dots only show once zoomed in this far (at state level they're just clutter).
const DOTS_MIN_ZOOM = 9;
function updateDots() {
  const show = map.getZoom() >= DOTS_MIN_ZOOM;
  if (show && !map.hasLayer(layer)) layer.addTo(map);
  if (!show && map.hasLayer(layer)) map.removeLayer(layer);
}
map.on('zoomend', updateDots);
updateDots();
const highlight = L.layerGroup().addTo(map);   // searched zip outline
const markers = new Map();
let rows = [];
const metricSel = document.getElementById('metric');

const fmt = v => v == null ? '—' : `${v.toFixed(2)} in`;

function render() {
  const metric = metricSel.value;
  for (const r of rows) {
    const v = r[metric];
    // plain dots: the snow color layer (snow.js) shows the amounts
    const style = { radius: 3, color: '#33415599', weight: 1, fillColor: '#ffffff', fillOpacity: 0.9 };
    let m = markers.get(r.zip);
    if (!m) {
      m = L.circleMarker([r.lat, r.lon], style).addTo(layer);
      m.on('click', () => showBoundary(r.zip, [r.lat, r.lon]));
      markers.set(r.zip, m);
    } else m.setStyle(style);
    m.bindTooltip(`${r.zip} ${r.place}: ${fmt(v)}`);
  }
  renderKey(metric);
}

// Color key
const key = L.control({ position: 'bottomright' });
key.onAdd = () => L.DomUtil.create('div', 'legend key');
key.addTo(map);
function renderKey(metric) {
  const s = SCALES[metric];
  let html = `<div><i style="background:#fff8"></i>none</div>`;
  for (let i = 0; i < s.length; i++)
    html += `<div><i style="background:${COLORS[i]}"></i>${s[i]}${s[i + 1] ? '–' + s[i + 1] : '+'} in</div>`;
  key.getContainer().innerHTML = html;
}


async function load() {
  rows = await (await fetch('/api/zips')).json();
  render();
  window.snowLayer?.refresh();
  const s = await (await fetch('/api/status')).json();
  document.getElementById('statusText').textContent = s.last_update
    ? `${s.zips} zips · updated ${new Date(s.last_update).toLocaleTimeString()}`
    : 'Waiting for first collection…';
}

async function showBoundary(zip, fallback) {
  highlight.clearLayers();
  try {
    const res = await fetch(`/api/zip/${zip}/boundary`);
    if (res.ok) {
      const shape = L.geoJSON(await res.json(), {
        interactive: false,
        style: { color: '#d97706', weight: 3, fill: false },
      }).addTo(highlight);
      // keep the zip clear of the color key in the bottom-right corner
      const box = key.getContainer().parentElement.getBoundingClientRect();
      const size = map.getSize();
      const side = size.x - box.width > 300;   // room beside the boxes?
      const phone = isPhone();
      let tl = phone ? [20, 20] : [40, 40];
      let br = side
        ? [Math.min(box.width + 30, size.x * 0.5), 70]
        : [tl[0], Math.min(box.height + 10, size.y * 0.45)];
      if (phone) {   // zip fills ~97% of the open area (was 75%; +30%)
        const fill = 0.975;
        const ex = (size.x - tl[0] - br[0]) * (1 - fill) / 2, ey = (size.y - tl[1] - br[1]) * (1 - fill) / 2;
        tl = [tl[0] + ex, tl[1] + ey];
        br = [br[0] + ex, br[1] + ey];
      }
      map.fitBounds(shape.getBounds(), {
        paddingTopLeft: tl, paddingBottomRight: br, maxZoom: phone ? 13.9 : 15,
      });
      return;
    }
  } catch (_) { /* fall through to point zoom */ }
  if (fallback) map.setView(fallback, isPhone() ? 11 : 13);   // no polygon (e.g. PO-box zip)
}

document.getElementById('search').addEventListener('submit', async e => {
  e.preventDefault();
  const z = document.getElementById('zip').value.trim();
  if (!/^\d{5}$/.test(z)) return;
  document.getElementById('zip').blur();     // drop the on-screen keyboard
  const r = rows.find(r => r.zip === z);
  if (!r) { alert(`Zip ${z} isn't tracked.`); return; }
  await showBoundary(z, [r.lat, r.lon]);
});
metricSel.addEventListener('change', render);

function connect() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  const dot = document.getElementById('dot');
  ws.onopen = () => dot.classList.add('live');
  ws.onmessage = ev => { if (JSON.parse(ev.data).type === 'update') load(); };
  ws.onclose = () => { dot.classList.remove('live'); setTimeout(connect, 3000); };
}

load();
connect();
setInterval(load, 5 * 60 * 1000);  // fallback refresh
</script>
<script src="/static/snow.js"></script>
<script src="/static/trucks.js"></script>
</body>
</html>
